version: 1
updated: 2026-07-27
todos:
  - id: confirm-harness-decisions
    status: closed
    area: planning
    summary: Confirm browser support, provider scope, release process, and data-retention expectations with the project owner.
  - id: design-full-tab-review-workspace
    status: closed
    area: product
    summary: Define the full-tab review workspace layout, state handoff from popup, operation buttons, and output preservation behavior.
  - id: plan-feedback-iteration-loop
    status: closed
    area: generation
    summary: Plan regeneration flow where user feedback revises the review while preserving reviewer notes, product context, previous draft, and missing-topic inputs.
  - id: plan-amazon-keyword-topic-input
    status: closed
    area: product
    summary: Define controls for user-supplied Amazon-requested keywords/topics missing from generated review output.
  - id: plan-follow-up-questions
    status: closed
    area: generation
    summary: Plan model-generated questions asking what a good review of this product would answer that the original pass did not cover.
  - id: document-gemini-byok-handoff
    status: closed
    area: planning
    summary: Record the Gemini BYOK scope, security decisions, implementation sequence, blocking generation UX, testing expectations, and next-machine start path.
  - id: manual-smoke-full-tab-workspace
    status: open
    area: testing
    summary: Manually verify in Chrome that Create Review opens review.html, initial generation continues in the tab, copy buttons work, follow-up questions generate, and regeneration uses feedback/missing topics/follow-up answers.
  - id: implement-provider-boundary
    status: open
    area: architecture
    summary: Extract Ollama networking from review-core.js, add a provider registry and normalized provider errors, and preserve provider-neutral prompt, validation, cleanup, and copy logic.
  - id: migrate-review-session-provider
    status: open
    area: persistence
    summary: Add provider, model, and providerConfigVersion to review sessions while treating legacy sessions as Ollama and never persisting provider credentials.
  - id: add-extension-provider-settings
    status: open
    area: product
    summary: Add an options_ui settings page and direct UI entry points for provider configuration, including a Configure Gemini route when the selected provider has no key.
  - id: implement-gemini-key-storage
    status: open
    area: security
    summary: Store Gemini credentials in chrome.storage.session by default, optionally remember them in trusted local storage, never sync or persist them with reviews, and provide validate and clear actions.
  - id: implement-gemini-provider
    status: open
    area: generation
    summary: Add Gemini BYOK generation for initial reviews, regeneration, and follow-up questions using structured response contracts and deterministic cleanup.
  - id: add-provider-model-selection
    status: open
    area: product
    summary: Replace the Ollama-only model selector with provider and provider-specific model controls backed by a small explicit Gemini model allowlist.
  - id: add-remote-data-disclosure
    status: open
    area: privacy
    summary: Clearly disclose which reviewer notes, product context, previous draft, and revision inputs are sent to Gemini, while excluding account data, cookies, full page HTML, tab IDs, and URLs.
  - id: implement-blocking-generation-overlay
    status: open
    area: ui
    summary: Lock the review workspace during generation, prevent duplicate requests, show a dominant Generating Review message with provider/model context, and use a large animated indeterminate progress bar with honest stage messages.
  - id: add-generation-failure-recovery
    status: open
    area: ui
    summary: On provider failure, remove the workspace lock, preserve the previous usable draft, display a non-secret-bearing error, and provide an obvious retry path.
  - id: test-provider-and-secret-boundaries
    status: open
    area: testing
    summary: Add automated coverage for provider selection, session migration, request serialization, structured parsing, missing and invalid keys, secret redaction, Ollama regression, duplicate request prevention, and blocking-state recovery.
  - id: update-gemini-user-documentation
    status: open
    area: documentation
    summary: Update README and project references with Gemini BYOK setup, settings navigation, remote-data handling, credential storage behavior, and validation steps.
  - id: design-provider-stage-tracker
    status: backlog
    area: ui
    summary: Nice to have: evolve the generation overlay into a Domino's Pizza Tracker-style stage display with completed, active, and pending states but no fabricated percentages.
  - id: plan-existing-review-enrichment
    status: backlog
    area: generation
    summary: Low priority: sample a capped set of visible Amazon reviews for topic and vocabulary enrichment while preventing copied wording and borrowed reviewer experiences.
  - id: plan-review-history
    status: open
    area: persistence
    summary: Later, recommend best-practice local history storage, review version model, deletion behavior, privacy boundaries, and UI entry points.
  - id: add-popup-regression-tests
    status: open
    area: testing
    summary: Add automated coverage for prompt construction, JSON extraction, text cleanup, and error formatting if a test runner is introduced.
  - id: document-manual-smoke-path
    status: open
    area: testing
    summary: Expand manual validation for loading the unpacked extension, selecting a provider and model, configuring Gemini, scraping an Amazon page, generating reviews, and copying generated output.
